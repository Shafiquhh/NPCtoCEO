<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Sim // Daily Clarity Game</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😎</text></svg>" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

  <!-- Comic-style display + body fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

  <!-- Drawflow -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow@0.0.59/dist/drawflow.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/drawflow@0.0.59/dist/drawflow.min.js"></script>
</head>
<body>

  <div class="app-shell">

    <!-- Mobile-only sidebar toggle -->
    <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Toggle menu">☰</button>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- LEFT SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <h1 class="sidebar-title">Daily Log</h1>

      <div class="control-group">
        <label for="category-select">Category</label>
        <select id="category-select"></select>
      </div>

      <div class="control-group">
        <label for="habit-select">Habit</label>
        <select id="habit-select"></select>
      </div>

      <div class="control-group">
        <label for="custom-note-input">Note (optional)</label>
        <input
          type="text"
          id="custom-note-input"
          placeholder="e.g. 'felt kinda proud tbh'"
          maxlength="80"
        />
      </div>

      <button id="add-node-btn">+ Add to Canvas</button>

      <div class="happiness-meter-wrap">
        <label>Vibe Meter</label>
        <div class="happiness-bar-track">
          <div id="happiness-bar-fill" class="happiness-bar-fill"></div>
        </div>
        <span id="happiness-value">50</span>/100
      </div>

      <div class="sidebar-actions">
        <button id="download-btn" class="secondary-btn">⬇ Download Backup</button>
      </div>
      <div class="sidebar-actions">
        <label for="upload-input" class="secondary-btn upload-label">⬆ Load from File</label>
        <input type="file" id="upload-input" accept="application/json" hidden />
      </div>

      <p id="status-msg" class="status-msg"></p>
    </aside>

    <!-- CANVAS -->
    <main class="canvas-wrap">
      <div id="drawflow" class="drawflow-canvas"></div>

      <!-- Particle / floating-score effects layer -->
      <div id="fx-layer"></div>

      <!-- Fixed avatar overlay -->
      <div id="avatar-container" class="avatar-mood-neutral">
        <div class="speech-bubble">
          <p id="avatar-speech">sup. log something and let's see the damage.</p>
        </div>
        <div class="avatar-visual">
          <svg class="charge-battery" viewBox="0 0 80 140">
            <!-- Battery body outline -->
            <rect x="12" y="18" width="56" height="104" rx="8" fill="none" stroke="#111111" stroke-width="5" />
            <!-- Battery terminal nub at top -->
            <rect x="33" y="8" width="14" height="12" rx="2" fill="none" stroke="#111111" stroke-width="4" />

            <!-- 6 bars that fill from bottom to top based on happiness -->
            <!-- Bar 1 (bottom) - fills first at 0-16% -->
            <rect class="battery-bar" data-bar="1" x="16" y="105" width="48" height="12" rx="2" />
            <!-- Bar 2 - fills at 16-33% -->
            <rect class="battery-bar" data-bar="2" x="16" y="90" width="48" height="12" rx="2" />
            <!-- Bar 3 - fills at 33-50% -->
            <rect class="battery-bar" data-bar="3" x="16" y="75" width="48" height="12" rx="2" />
            <!-- Bar 4 - fills at 50-66% -->
            <rect class="battery-bar" data-bar="4" x="16" y="60" width="48" height="12" rx="2" />
            <!-- Bar 5 - fills at 66-83% -->
            <rect class="battery-bar" data-bar="5" x="16" y="45" width="48" height="12" rx="2" />
            <!-- Bar 6 (top) - fills at 83-100% -->
            <rect class="battery-bar" data-bar="6" x="16" y="30" width="48" height="12" rx="2" />
          </svg>
          <div id="avatar-emoji" class="avatar-emoji">😐</div>
        </div>
      </div>
    </main>

  </div>

  <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
