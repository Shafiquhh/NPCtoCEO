<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Clarity Game</title>

    <!-- Drawflow CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow@0.0.58/dist/drawflow.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="game-header">
        <h2>🎮 Daily Life Sim & Clarity Tracker</h2>
        <button id="saveBtn" onclick="saveDay()">End & Save Day</button>
    </div>

    <div class="game-wrapper">
        <!-- CONTROL PANEL -->
        <div class="sidebar">
            <h3>🗂️ Log Your Day</h3>
            <p class="subtitle">Choose what you did:</p>

            <div class="form-group">
                <label for="habitSelect">Select Habit:</label>
                <select id="habitSelect" class="styled-select">
                    <option value="reels">📱 Entertainment (Reels/Scroll)</option>
                    <option value="work">⚡ Productivity (Deep Work)</option>
                    <option value="gym">💪 Health (Gym/Workout)</option>
                </select>
            </div>

            <button class="add-btn" onclick="handleDirectClick()">Add to Canvas ➕</button>
        </div>

        <!-- CENTRE: The Canvas & Avatar Stage -->
        <div id="drawflow">
            <div id="avatar-stage">
                <div id="speech-bubble" class="bubble">"Hey bestie, what are we doing today?"</div>
                <div id="avatar-character" class="avatar">😐</div>
            </div>
        </div>
    </div>

    <!-- Drawflow JS CDN -->
    <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow@0.0.58/dist/drawflow.min.js"></script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/game.js') }}?v=5"></script>
</body>
</html>
